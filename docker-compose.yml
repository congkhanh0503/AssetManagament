services:
  # ========================================================
  # 1. Database Service: PostgreSQL 16 Alpine
  # ========================================================
  postgres:
    image: postgres:16-alpine
    container_name: qlkho_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-QLKhoAssetDB}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-QLKho@Asset2026Secure!}"
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - qlkho-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-QLKhoAssetDB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ========================================================
  # 2. Backend Service: .NET 10 Web API
  # ========================================================
  backend:
    build:
      context: ./QLKho.Api
      dockerfile: Dockerfile
    container_name: qlkho_backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Production}"
      ASPNETCORE_URLS: "http://+:5000"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-QLKhoAssetDB};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-QLKho@Asset2026Secure!};"
    ports:
      - "${API_PORT:-5000}:5000"
    volumes:
      # Mount volume để lưu trữ file PDF scan bàn giao lâu dài không bị mất
      - uploads_data:/app/wwwroot/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - qlkho-network

  # ========================================================
  # 3. Frontend Service: Vue 3 + Vite + Nginx Reverse Proxy
  # ========================================================
  frontend:
    build:
      context: ./QLkho.Web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "/api"
    container_name: qlkho_frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - backend
    networks:
      - qlkho-network

# ==========================================================
# Persistent Volumes & Networks
# ==========================================================
volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local

networks:
  qlkho-network:
    driver: bridge
