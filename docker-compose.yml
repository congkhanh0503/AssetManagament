services:
  # ========================================================
  # 0. Database Service: PostgreSQL 16
  # ========================================================
  db:
    image: postgres:16-alpine
    container_name: qlkho_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qlkho_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres@2026}
    ports:
      # Map ra cổng 5433 để tránh trùng với PostgreSQL Service local trên máy nếu có
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-qlkho_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - qlkho-network

  # ========================================================
  # 1. Backend Service: .NET 10 Web API
  # ========================================================
  backend:
    build:
      context: ./QLKho.Api
      dockerfile: Dockerfile
    container_name: qlkho_backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Production}"
      ASPNETCORE_URLS: "http://+:5000"
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB:-qlkho_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres@2026};Include Error Detail=true;"
    ports:
      - "${API_PORT:-5000}:5000"
    volumes:
      # Mount volume để lưu trữ file PDF scan bàn giao lâu dài không bị mất
      - uploads_data:/app/wwwroot/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - qlkho-network

  # ========================================================
  # 2. Frontend Service: Vue 3 + Vite + Nginx Reverse Proxy
  # ========================================================
  frontend:
    build:
      context: ./QLkho.Web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "/api"
    container_name: qlkho_frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-6767}:67"
    depends_on:
      - backend
    networks:
      - qlkho-network

# ==========================================================
# Persistent Volumes & Networks
# ==========================================================
volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local

networks:
  qlkho-network:
    driver: bridge

